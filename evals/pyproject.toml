[project]
name = "groundwork-evals"
version = "0.1.0"
description = "Eval harness for Groundwork. External test rig — talks to the deployed API over HTTP; never imported by the application."
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32,<3",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "responses>=0.25,<1",
]

[project.scripts]
groundwork-evals = "groundwork_evals.runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["groundwork_evals*"]
