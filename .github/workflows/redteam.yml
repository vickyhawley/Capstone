name: Red team

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - '**/prompts/**'
      - '.github/workflows/redteam.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redteam:
    name: Prompt-injection / boundary / insecure-output / excessive-agency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Placeholder — the red-team set lands with the first prompt in the
      # tree. Same exit-code contract as evals.yml: non-zero fails the PR.
      - name: Run placeholder red-team
        run: |
          echo "No prompts in tree yet. Red-team set lands when the safety"
          echo "gate ships in Sprint 2."
          exit 0
