# NFCS delivery districts — data for GW-21 delivery zone tool.
#
# What this is: the outward postcode districts NFCS delivers to,
# plus their approximate road distance from the shop (Ringwood, near
# Jubilee Park). Postcode lookup returns:
#   - within_radius: true  → the tool says confident yes.
#   - within_radius: false → the tool defers to staff.
# Not in the list → the tool defers to staff.
#
# See data/guides/delivery.md for the customer-facing policy. The
# guide's own text: "near the boundary or beyond — do not refuse.
# Route to staff. The assistant must not be the first thing to
# enforce it." Two states, not three; there is no `confident_no`.
#
# Provenance: mirrors scripts/generate_orders.py::DISTRICTS. Road
# distances are curated approximations, not survey data. Unified
# source of truth is a Sprint-4 refactor (post-capstone roadmap).
# Keep the two files in sync until then.
#
# Editing:
# - Adding a district: coordinate with the SME first. If NFCS starts
#   delivering to a new area, add it here with an approximate road
#   distance and within_radius flag.
# - Removing: same.
# - Additions are curation, not code. Loaded at process start.

