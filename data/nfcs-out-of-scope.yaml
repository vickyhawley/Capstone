# NFCS out-of-scope brands — data for GW-20 stock lookup tool.
#
# What this is: brands NFCS will not stock for COMMERCIAL reasons
# (competitive relationships with local stockists). Substring match
# on the customer's productQuery → tool returns `unavailable` with
# the entry's `reason` returned as `outOfScopeReason`.
#
# Distinct from `data/nfcs-pending.yaml`, which captures categories
# NFCS plans to hold once a pre-condition is met (regulatory
# accreditation, unit lease, etc.).
#
# Provenance: SME conversation 2026-09-17 with NFCS shop owner. See
# docs/adr/0016-stock-lookup-three-state.md §SME correction for the
# full arc — the previous version of this file (2026-09-17 morning)
# was category-based (wormers, electric fencing, Simple Systems),
# seeded from the golden dataset. That seed reasoned on the wrong
# axis; the SME correction moved the reasoning to brand-commercial.
#
# Editing:
# - Adding a brand: coordinate with the shop first. Should carry a
#   `reason` naming the local stockist or the commercial context.
# - Removing a brand (e.g. Aivly closes and NFCS picks up the range):
#   remove the entry; re-run the harness; confirm the customer-facing
#   answer for that brand flips from "we don't carry X, Aivly stocks
#   it locally" to whatever the retrieval + pending model produces.
# - Additions are curation, not code. This file is loaded at process
#   start; changes require a process restart.
#
# Schema per entry:
#   name:    short human label for the brand
#   matcher: 'substring' — case-insensitive substring match on the
#            customer's productQuery string. Only shape supported
#            today.
#   pattern: the substring to match
#   reason:  short SME-facing prose. Returned to the tool caller as
#            outOfScopeReason. Synthesis composes the customer-facing
#            wording; the reason names the commercial context so
#            synthesis can produce a genuinely-useful answer like
#            "we don't carry LeMieux; Aivly stocks it locally"
#            rather than a bare refusal.

entries:
  - name: Ariat
    matcher: substring
    pattern: Ariat
    reason: >-
      NFCS does not stock Ariat. Aivly (local stockist) carries the
      Ariat range; customers should be directed there for Ariat
      products. Commercial decision, not a category rule.

  - name: LeMieux
    matcher: substring
    pattern: LeMieux
    reason: >-
      NFCS does not stock LeMieux. Aivly (local stockist) carries the
      LeMieux range; customers should be directed there for LeMieux
      products. Commercial decision, not a category rule.
